<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function() {
  var APP_NAME = 'TCP 생산관리 시스템';
  var APP_VER = 'V083S';
  var SB_DEFAULT_URL = 'https://tmbeaswlpvsyjehacgsa.supabase.co';
  var SB_DEFAULT_KEY = 'sb_publishable_OM6ITpYn8LYPWXXhwdA4kQ_HuAyAxV9';
  var CFG_KEY = 'mfg-sb-test-cfg', AUTH_KEY = 'mfg-sb-test-auth', LAST_EMAIL = 'mfg-sb-test-last-email';
  var PORTAL_URL = 'https://eatonmfgkorea-maker.github.io/MFGManagement/';

  function getCfg() { try { var s = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (s && s.url && s.key) return s; } catch (e) {} return { url: SB_DEFAULT_URL, key: SB_DEFAULT_KEY }; }
  var cfg = getCfg(), client = null;
  try { client = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: AUTH_KEY } }); } catch (e) { console.error('서버 연결 초기화 실패', e); }
  window.MFG_SB = client; window.MFG_USER = null;
  var resolveReady; window.__sbReady = new Promise(function(r) { resolveReady = r; });
  var errText = function(e) { if (!e) return '알 수 없는 오류'; var m = e.message || e.error_description || String(e); return /invalid login credentials/i.test(m) ? '이메일 또는 비밀번호가 올바르지 않습니다.' : m; };

  function $(id) { return document.getElementById(id); }
  var inp = 'width:100%;padding:0.6rem 0.75rem;border-radius:0.5rem;border:1px solid #475569;background:#0b1220;color:#e2e8f0;font-size:0.9rem;box-sizing:border-box;';
  var btn = 'width:100%;padding:0.65rem;border:0;border-radius:0.5rem;background:#2563eb;color:#fff;font-weight:600;font-size:0.95rem;cursor:pointer;';

  function overlay() {
    if ($('mfgAuthOverlay')) return;
    var div = document.createElement('div');
    div.id = 'mfgAuthOverlay';
    div.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,26,0.96);backdrop-filter:blur(8px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:1rem;font-family:Pretendard,"Malgun Gothic",-apple-system,sans-serif;';
    div.innerHTML =
      '<div style="background:#0f172a;border:1px solid rgba(255,255,255,0.1);border-radius:1rem;padding:2rem;width:100%;max-width:24rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);text-align:center;">' +
        '<h2 style="font-size:1.3rem;font-weight:bold;color:#fff;margin:0;">' + APP_NAME + '</h2>' +
        '<div style="display:inline-block;margin:0.4rem 0 0.2rem;padding:1px 10px;border-radius:6px;background:#fff;color:#111827;font-size:0.75rem;font-weight:800;letter-spacing:1px;">' + APP_VER + '</div>' +
        '<p style="font-size:0.85rem;color:#94a3b8;margin:0.5rem 0 1.25rem;">승인된 계정으로 로그인하세요</p>' +
        '<form id="mfgLoginForm" style="display:flex;flex-direction:column;gap:0.5rem;text-align:left;">' +
          '<input id="mfgEmail" type="email" placeholder="이메일" autocomplete="username" style="' + inp + '">' +
          '<input id="mfgPw" type="password" placeholder="비밀번호" autocomplete="current-password" style="' + inp + '">' +
          '<button id="mfgLoginBtn" type="submit" style="' + btn + 'margin-top:0.25rem;">로그인</button>' +
        '</form>' +
        '<div id="mfgAuthMsg" style="display:none;font-size:0.85rem;margin-top:1rem;padding:0.6rem 0.8rem;border-radius:0.5rem;line-height:1.6;word-break:break-all;text-align:left;"></div>' +
        '<div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;">' +
          '<a href="' + PORTAL_URL + '" style="font-size:0.8rem;color:#94a3b8;text-decoration:none;">← 메인 포털로 돌아가기</a>' +
          '<a href="#" id="mfgCfgLink" style="font-size:0.8rem;color:#94a3b8;text-decoration:none;">⚙️ 서버 설정</a>' +
        '</div>' +
      '</div>';
    document.body.appendChild(div);
    document.body.style.overflow = 'hidden';
    try { $('mfgEmail').value = localStorage.getItem(LAST_EMAIL) || ''; } catch (e) {}
    $('mfgLoginForm').addEventListener('submit', function(ev) { ev.preventDefault(); doLogin(); });
    $('mfgCfgLink').addEventListener('click', function(ev) { ev.preventDefault(); openSettings(); });
    ($('mfgEmail').value ? $('mfgPw') : $('mfgEmail')).focus();
  }
  function removeOverlay() { var el = $('mfgAuthOverlay'); if (el) el.remove(); document.body.style.overflow = ''; }
  function msg(text, kind) {
    var el = $('mfgAuthMsg'); if (!el) return;
    el.style.display = 'block'; el.innerHTML = text;
    if (kind === 'err') { el.style.background = 'rgba(239,68,68,0.12)'; el.style.color = '#fca5a5'; }
    else if (kind === 'ok') { el.style.background = 'rgba(16,185,129,0.12)'; el.style.color = '#6ee7b7'; }
    else { el.style.background = 'rgba(59,130,246,0.12)'; el.style.color = '#93c5fd'; }
  }

  function finishLogin(email) {
    return client.rpc('my_role').then(function(r) {
      if (r.error) throw r.error;
      if (!r.data) { return client.auth.signOut().then(function() { throw { message: '<b>' + email + '</b><br>승인되지 않은 계정입니다. 관리자에게 승인을 요청하세요.' }; }); }
      window.MFG_USER = { email: email, role: r.data, isAdmin: r.data === 'admin', logout: logout };
      removeOverlay();
      ensureGear();
      resolveReady(window.MFG_USER);
    });
  }
  function doLogin() {
    var em = ($('mfgEmail').value || '').trim().toLowerCase(), pw = $('mfgPw').value || '';
    if (!em || !pw) { msg('이메일과 비밀번호를 입력하세요.', 'err'); return; }
    if (!client) { msg('서버 설정이 없습니다. ⚙️ 서버 설정에서 URL과 key를 입력하세요.', 'err'); return; }
    $('mfgLoginBtn').disabled = true; msg('확인 중...', 'info');
    client.auth.signInWithPassword({ email: em, password: pw }).then(function(r) {
      if (r.error) throw r.error;
      try { localStorage.setItem(LAST_EMAIL, em); } catch (e) {}
      return finishLogin(em);
    }).then(function() { msg('로그인 성공', 'ok'); }).catch(function(e) { msg(errText(e), 'err'); })
      .then(function() { var b = $('mfgLoginBtn'); if (b) b.disabled = false; });
  }
  function logout() {
    if (!confirm('로그아웃 하시겠습니까?')) return;
    var p = client ? client.auth.signOut() : Promise.resolve();
    p.then(function() { location.reload(); }, function() { location.reload(); });
  }

  // ===== ⚙️ 서버 설정 (로그아웃 · URL/key · 승인 사용자) =====
  function ensureGear() {
    if ($('mfgGear')) return;
    var g = document.createElement('button');
    g.id = 'mfgGear'; g.type = 'button'; g.title = '서버 설정 / 로그아웃'; g.textContent = '⚙️';
    g.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9000;width:38px;height:38px;border-radius:50%;border:1px solid #cbd5e1;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;font-size:18px;line-height:1;';
    g.addEventListener('click', openSettings);
    document.body.appendChild(g);
  }
  function openSettings() {
    if ($('mfgCfgModal')) return;
    var u = window.MFG_USER, c = getCfg();
    var m = document.createElement('div');
    m.id = 'mfgCfgModal';
    m.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,0.55);display:flex;align-items:center;justify-content:center;padding:1rem;font-family:Pretendard,"Malgun Gothic",-apple-system,sans-serif;';
    m.innerHTML =
      '<div style="background:#fff;border-radius:0.9rem;padding:1.25rem 1.4rem;width:100%;max-width:30rem;max-height:92vh;overflow:auto;color:#1e293b;font-size:0.9rem;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;"><b style="font-size:1.05rem;">⚙️ 서버 설정</b><button id="mfgCfgClose" type="button" style="border:0;background:none;font-size:1.2rem;cursor:pointer;">✕</button></div>' +
        (u ? '<div style="display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0.75rem;background:#f1f5f9;border-radius:0.5rem;margin-bottom:0.9rem;"><span>' + u.email + ' <span style="color:#64748b;font-size:0.8rem;">(' + (u.isAdmin ? '관리자' : '사용자') + ')</span></span><button id="mfgLogoutBtn" type="button" style="padding:0.3rem 0.7rem;border:1px solid #cbd5e1;border-radius:0.4rem;background:#fff;cursor:pointer;">로그아웃</button></div>' : '') +
        '<div style="font-weight:600;margin-bottom:0.3rem;">서버 주소 / key</div>' +
        '<input id="mfgCfgUrl" placeholder="https://xxxx.supabase.co" value="' + c.url + '" style="' + inp.replace('#0b1220', '#fff').replace('#e2e8f0', '#1e293b').replace('#475569', '#cbd5e1') + 'margin-bottom:0.4rem;">' +
        '<input id="mfgCfgKey" placeholder="sb_publishable_..." value="' + c.key + '" style="' + inp.replace('#0b1220', '#fff').replace('#e2e8f0', '#1e293b').replace('#475569', '#cbd5e1') + '">' +
        '<div style="display:flex;gap:0.4rem;margin:0.5rem 0 1rem;"><button id="mfgCfgSave" type="button" style="' + btn + 'width:auto;padding:0.45rem 0.9rem;">저장 후 새로고침</button><button id="mfgCfgReset" type="button" style="padding:0.45rem 0.9rem;border:1px solid #cbd5e1;border-radius:0.5rem;background:#fff;cursor:pointer;">기본값</button></div>' +
        (u && u.isAdmin ? '<div style="font-weight:600;margin-bottom:0.3rem;">승인 사용자</div><div id="mfgApprList" style="border:1px solid #e2e8f0;border-radius:0.5rem;max-height:14rem;overflow:auto;margin-bottom:0.5rem;"></div>' +
          '<div style="display:flex;gap:0.4rem;"><input id="mfgApprEmail" placeholder="이메일" style="' + inp.replace('#0b1220', '#fff').replace('#e2e8f0', '#1e293b').replace('#475569', '#cbd5e1') + 'flex:1;"><select id="mfgApprRole" style="border:1px solid #cbd5e1;border-radius:0.5rem;padding:0 0.4rem;"><option value="user">사용자</option><option value="admin">관리자</option></select><button id="mfgApprAdd" type="button" style="' + btn + 'width:auto;padding:0.45rem 0.8rem;">추가</button></div>' +
          '<div style="font-size:0.78rem;color:#64748b;margin-top:0.5rem;">계정 생성은 Supabase → Authentication → Users → Add user (Auto Confirm 체크). 여기서는 승인 여부와 역할만 관리합니다.</div>' : '') +
      '</div>';
    document.body.appendChild(m);
    $('mfgCfgClose').addEventListener('click', function() { m.remove(); });
    m.addEventListener('click', function(ev) { if (ev.target === m) m.remove(); });
    if ($('mfgLogoutBtn')) $('mfgLogoutBtn').addEventListener('click', logout);
    $('mfgCfgSave').addEventListener('click', function() {
      var url = ($('mfgCfgUrl').value || '').trim().replace(/\/+$/, ''), key = ($('mfgCfgKey').value || '').trim();
      if (!/^https:\/\/.+/.test(url) || !key) { alert('URL은 https:// 로 시작해야 하고 key가 필요합니다.'); return; }
      try { localStorage.setItem(CFG_KEY, JSON.stringify({ url: url, key: key })); } catch (e) {}
      location.reload();
    });
    $('mfgCfgReset').addEventListener('click', function() { try { localStorage.removeItem(CFG_KEY); } catch (e) {} location.reload(); });
    if (u && u.isAdmin) {
      var list = function() {
        client.from('approved_users').select('email,role').order('email').then(function(r) {
          var el = $('mfgApprList'); if (!el) return;
          if (r.error) { el.innerHTML = '<div style="padding:0.5rem;color:#dc2626;">' + errText(r.error) + '</div>'; return; }
          el.innerHTML = (r.data || []).map(function(x) {
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0.6rem;border-bottom:1px solid #f1f5f9;"><span>' + x.email + ' <span style="color:#64748b;font-size:0.78rem;">' + (x.role === 'admin' ? '관리자' : '사용자') + '</span></span>' +
              (x.email === u.email ? '' : '<button type="button" data-em="' + x.email + '" style="border:0;background:none;color:#dc2626;cursor:pointer;">삭제</button>') + '</div>';
          }).join('') || '<div style="padding:0.5rem;color:#64748b;">없음</div>';
          el.querySelectorAll('button[data-em]').forEach(function(b) {
            b.addEventListener('click', function() {
              var em = b.getAttribute('data-em');
              if (!confirm(em + ' 승인을 해제하시겠습니까?')) return;
              client.from('approved_users').delete().eq('email', em).then(function(r2) { if (r2.error) alert('삭제 실패: ' + errText(r2.error)); list(); });
            });
          });
        });
      };
      list();
      $('mfgApprAdd').addEventListener('click', function() {
        var em = ($('mfgApprEmail').value || '').trim().toLowerCase(), role = $('mfgApprRole').value;
        if (!em || em.indexOf('@') < 0) { alert('이메일을 입력하세요.'); return; }
        client.from('approved_users').upsert({ email: em, role: role }).then(function(r) { if (r.error) { alert('추가 실패: ' + errText(r.error)); return; } $('mfgApprEmail').value = ''; list(); });
      });
    }
  }

  function boot() {
    if (!client) { overlay(); msg('서버 설정이 없습니다. ⚙️ 서버 설정에서 URL과 key를 입력하세요.', 'err'); return; }
    client.auth.getSession().then(function(r) {
      var s = r && r.data && r.data.session;
      if (s && s.user && s.user.email) return finishLogin(String(s.user.email).toLowerCase());
      overlay();
    }).catch(function(e) { overlay(); msg(errText(e), 'err'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

  <!-- IndexedDB 헬퍼 (500MB 저장 지원) -->
  <script>
    const DB_NAME = 'TCP_ProductionDB_SB';   // Supabase판 전용 (기존 앱과 분리)
    const DB_VERSION = 1;
    const STORE_NAME = 'appData';
    
    // IndexedDB 열기
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'key' });
          }
        };
      });
    }
    
    // 데이터 저장
    async function saveToIndexedDB(key, data) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({ key, data, updatedAt: new Date().toISOString() });
        return new Promise((resolve, reject) => {
          tx.oncomplete = () => { db.close(); resolve(true); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        });
      } catch (err) {
        console.error('IndexedDB 저장 오류:', err);
        return false;
      }
    }
    
    // 데이터 불러오기
    async function loadFromIndexedDB(key) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(key);
        return new Promise((resolve, reject) => {
          request.onsuccess = () => { 
            db.close(); 
            resolve(request.result ? request.result.data : null); 
          };
          request.onerror = () => { db.close(); reject(request.error); };
        });
      } catch (err) {
        console.error('IndexedDB 로드 오류:', err);
        return null;
      }
    }
    
    // 저장된 데이터 크기 계산
    async function getStorageSize() {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        return new Promise((resolve) => {
          request.onsuccess = () => {
            const data = request.result;
            const size = new Blob([JSON.stringify(data)]).size;
            db.close();
            resolve(size);
          };
          request.onerror = () => { db.close(); resolve(0); };
        });
      } catch (err) {
        return 0;
      }
    }
  </script>

function enforceOt(){const out=[];for(const d in st.otx){const m=st.otx[d];for(const n in m){const b=otBlock(d,n);if(b&&(m[n].k||m[n].h)){delete m[n].k;delete m[n].h;out.push(`${n}(${md(d)} ${b})`);if(!m[n].sh&&!m[n].memo)delete m[n]}}if(!Object.keys(m).length)delete st.otx[d]}return out}

function day(d){
  const r=st.roster[d]||(st.roster[d]={});
  for(const sh of SH){r[sh]=r[sh]||{};for(const c of st.cfg[sh])r[sh][c.k]=r[sh][c.k]||{L:null,M:[]}}
  r.abs=r.abs||{};for(const k of ABK)r.abs[k]=r.abs[k]||[];
  r.st=r.st||{};return r;
}
const peek=d=>st.roster[d];
function placements(d){
  const r=peek(d),P={};if(!r)return P;
  const put=(n,w)=>{if(n)(P[n]=P[n]||[]).push(w)};
  for(const sh of SH){const L=r[sh]||{};for(const k in L){const v=L[k];put(v.L,{t:'s',sh,k,i:'L'});(v.M||[]).forEach((n,i)=>put(n,{t:'s',sh,k,i}))}}
  for(const k of ABK)(r.abs?.[k]||[]).forEach((a,j)=>put(a.n,{t:'a',ab:k,j}));
  return P;
}
const wl=w=>w.sh==='야간'?'야간':'주간 '+w.k;

function hrs(n,d){ // {nor,o15,o2,sh}

  const P=placements(d)[n];if(!P||!r)return z;const w=P.find(x=>x.t==='s');if(!w)return z;
  const c=r.st?.[n]||0;z.sh=w.sh;if(dtype(d)==='근무')z.nor=(c===2||c===3)?4:8;return z;
}
const isHalf=(r,n)=>[2,3].includes(r?.st?.[n]);
function stats(d){
  const r=peek(d),P=placements(d),act=activeList(d);
  const cnt={주간:0,야간:0},ab={휴가:0,병가:0,기타:0};
  for(const n in P)for(const w of P[n]){if(w.t==='s')cnt[w.sh]++;else ab[w.ab]++}
  const dups=Object.entries(P).filter(([n,w])=>{if(w.length<2)return false;
    if(w.length===2&&isHalf(r,n)&&w.some(x=>x.t==='s')&&w.some(x=>x.ab==='휴가'))return false;return true});
  const unreg=Object.keys(P).filter(n=>!active(n,d));

  return {act,cnt,ab,dups,unreg,un,low,P};
}

/* ---------- mutations ---------- */
function getAt(r,t){if(t.kind==='s'){const v=r[t.sh][t.k];return t.i==='L'?v.L:(v.M[t.i]||null)}if(t.kind==='a'){const a=r.abs[t.ab][t.j];return a?a.n:null}return null}
function setAt(r,t,n){
  if(t.kind==='s'){const v=r[t.sh][t.k];if(t.i==='L')v.L=n;else{v.M[t.i]=n;for(let j=0;j<v.M.length;j++)if(v.M[j]===undefined)v.M[j]=null;while(v.M.length&&!v.M[v.M.length-1])v.M.pop()}}
  else if(t.kind==='a'){const L=r.abs[t.ab];if(!n){L.splice(t.j,1);return}if(t.j<L.length)L[t.j]={n,r:L[t.j].r&&L[t.j].n===n?L[t.j].r:''};else L.push({n,r:''})}
}
function removeName(r,n,onlyAbs){ // returns first old position
  let old=null;
  if(!onlyAbs)for(const sh of SH)for(const k in r[sh]){const v=r[sh][k];
    if(v.L===n){old=old||{kind:'s',sh,k,i:'L'};v.L=null}
    v.M.forEach((x,i)=>{if(x===n){old=old||{kind:'s',sh,k,i};v.M[i]=null}});
    while(v.M.length&&!v.M[v.M.length-1])v.M.pop()}
  for(const k of ABK){const L=r.abs[k];for(let j=L.length-1;j>=0;j--)if(L[j].n===n){old=old||{kind:'a',ab:k,j};L.splice(j,1)}}
  return old;
}
function drop(n,src,t){
  const r=day(t.d);
  if(t.kind==='pool'){if(src===t.d){removeName(r,n);delete r.st[n]}return}
  if(getAt(r,t)===n)return;
  const keepSlot=t.kind==='a'&&t.ab==='휴가'&&isHalf(r,n);
  const old=removeName(r,n,keepSlot);
  if(t.kind==='a'&&!keepSlot)delete r.st[n];
  if(src!==t.d&&t.kind==='s')delete r.st[n];
  const y=getAt(r,t);
  setAt(r,t,n);
  if(y&&y!==n&&old&&!(old.kind==='a'&&t.kind==='a'&&old.ab===t.ab)){setAt(r,old,y)}
}
function cycle(d,n){
  const r=day(d);const c=r.st[n]||0;const nx=(c+1)%4;
  if(nx)r.st[n]=nx;else delete r.st[n];
  const L=r.abs['휴가'];const j=L.findIndex(a=>a.n===n);
  if(nx===2||nx===3){if(j<0)L.push({n,r:STL[nx],auto:1});else{L[j].r=STL[nx];L[j].auto=1}}
  else if(j>=0&&L[j].auto)L.splice(j,1);
}

G.addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(!c)return;dragN=c.dataset.n;dragSrc=c.dataset.src;try{e.dataTransfer.setData('text/plain',dragN);e.dataTransfer.effectAllowed='copyMove'}catch(_){}});
G.addEventListener('dragover',e=>{const td=e.target.closest('.cell');if(!td||!dragN)return;e.preventDefault();G.querySelectorAll('.dz').forEach(x=>x!==td&&x.classList.remove('dz'));td.classList.add('dz')});
G.addEventListener('dragleave',e=>{const td=e.target.closest('.cell');if(td&&!td.contains(e.relatedTarget))td.classList.remove('dz')});
G.addEventListener('drop',e=>{const td=e.target.closest('.cell');if(!td||!dragN)return;e.preventDefault();
  const t=tgtOf(td);drop(dragN,dragSrc,t);
  if(dragSrc!==t.d&&t.kind!=='pool')flash(`${md(dragSrc)} → ${md(t.d)} ${dragN} 복사`);
  dragN=null;edit=null;save();render()});
let dragDay=null,undo=null;
G.addEventListener('dragstart',e=>{const th=e.target.closest&&e.target.closest('th[data-hd]');if(!th)return;dragDay=th.dataset.hd;try{e.dataTransfer.setData('text/plain',dragDay);e.dataTransfer.effectAllowed='copy'}catch(_){}});
G.addEventListener('dragover',e=>{if(!dragDay)return;const th=e.target.closest('th[data-hd]');if(!th||th.dataset.hd===dragDay)return;e.preventDefault();G.querySelectorAll('.dz').forEach(x=>x!==th&&x.classList.remove('dz'));th.classList.add('dz')});
G.addEventListener('drop',e=>{if(!dragDay)return;const th=e.target.closest('th[data-hd]');e.preventDefault();if(th&&th.dataset.hd!==dragDay)copyDay(dragDay,th.dataset.hd);dragDay=null});
function copyDay(src,dst){
  const s=peek(src);
  undo={d:dst,roster:st.roster[dst]?JSON.parse(JSON.stringify(st.roster[dst])):null,otx:st.otx[dst]?JSON.parse(JSON.stringify(st.otx[dst])):null,dt:st.dt[dst]};
  if(!s){delete st.roster[dst]}
  else{const c=JSON.parse(JSON.stringify(s));const ok=n=>n&&active(n,dst);
    for(const sh of SH)for(const k in c[sh]||{}){const v=c[sh][k];if(v.L&&!ok(v.L))v.L=null;v.M=(v.M||[]).map(n=>ok(n)?n:null);while(v.M.length&&!v.M[v.M.length-1])v.M.pop()}
    for(const k of ABK)c.abs[k]=(c.abs?.[k]||[]).filter(a=>ok(a.n));
    if(c.st)for(const n in c.st)if(!ok(n))delete c.st[n];
    st.roster[dst]=c}
  if(st.otx[src]){const o=JSON.parse(JSON.stringify(st.otx[src]));for(const n in o)if(!active(n,dst))delete o[n];st.otx[dst]=o}else delete st.otx[dst];
  if(!isWork(dst)&&hasWork(dst))st.dt[dst]='특근';
  save();render();
  const t=$('#rp-toast');t.innerHTML=`${md(src)} → ${md(dst)} 하루 편성 복사 완료 <button class="btn" id="rp-undoBtn">되돌리기</button>`;
  $('#rp-undoBtn').onclick=()=>{if(!undo)return;const u=undo;undo=null;if(u.roster)st.roster[u.d]=u.roster;else delete st.roster[u.d];
    if(u.otx)st.otx[u.d]=u.otx;else delete st.otx[u.d];if(u.dt)st.dt[u.d]=u.dt;else delete st.dt[u.d];save();render();flash('되돌렸습니다')};
  clearTimeout(flash.t);flash.t=setTimeout(()=>{t.textContent='';undo=null},8000);
}
G.addEventListener('dragend',()=>{dragN=null;dragDay=null;G.querySelectorAll('.dz').forEach(x=>x.classList.remove('dz'))});
G.addEventListener('click',e=>{
  const hd=e.target.closest('th[data-hd]');
  if(hd){const d=hd.dataset.hd;const t=dtype(d);
    if(isOffBase(d))st.dt[d]=t==='특근'?'휴무':'특근';
    else{if(t==='휴무')delete st.dt[d];else st.dt[d]='휴무'}
    save();render();return}
  if(e.target.closest('select,input'))return;
  const rm=e.target.closest('[data-rm]');const chipEl=e.target.closest('.chip');
  const td=e.target.closest('.cell');if(!td)return;const t=tgtOf(td);
  if(rm&&chipEl){const r=day(t.d);const n=chipEl.dataset.n;
    if(t.kind==='s'){setAt(r,t,null);if(isHalf(r,n)){const L=r.abs['휴가'];const j=L.findIndex(a=>a.n===n&&a.auto);if(j>=0)L.splice(j,1)}delete r.st[n]}
    else if(t.kind==='a'){const a=r.abs[t.ab][t.j];r.abs[t.ab].splice(t.j,1);if(a&&a.auto)delete r.st[a.n]}
    save();render();return}
  if(chipEl&&chipEl.dataset.cy){cycle(t.d,chipEl.dataset.n);save();render();return}
  if(chipEl&&chipEl.dataset.rsn){edit={...t,mode:'reason'};render();return}
  if(t.kind==='pool'||chipEl)return;
  edit=t;render();
});
G.addEventListener('contextmenu',e=>{
  const ch=e.target.closest('.chip[data-cy]');if(ch){e.preventDefault();cur=ch.dataset.src;otFocus=ch.dataset.n;setView('ot')}
});
G.addEventListener('change',e=>{
  if(e.target.dataset.pick&&edit){const n=e.target.value;if(n){drop(n,edit.d,edit);save()}edit=null;render()}
});
G.addEventListener('focusout',e=>{
  if(rendering||e.target.tagName!=='INPUT')return;
  if(!edit||!e.target.dataset.reason)return;
  const r=day(edit.d);const a=r.abs[edit.ab][edit.j];if(a){a.r=e.target.value.trim();a.auto=0}
  edit=null;save();render();
});
G.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.reason)e.target.blur();if(e.key==='Escape'){edit=null;render()}});

function renderAtt(days){
  const mons=[...new Set(days.map(d=>add(d,-((wd(d)+6)%7))))];
  const names=emps.filter(e=>days.some(d=>active(e.n,d))).sort((a,b)=>(isLead(b.n)-isLead(a.n))||a.j.localeCompare(b.j)).map(e=>e.n);
  const rows=names.map(n=>{let nor=0,o15=0,o2=0,wk=0,ab={휴가:0,병가:0,기타:0};
    days.forEach(d=>{const x=hrs(n,d);nor+=x.nor;o15+=x.o15;o2+=x.o2;if(x.sh)wk++;const P=placements(d)[n]||[];P.forEach(w=>{if(w.t==='a')ab[w.ab]+=(w.ab==='휴가'&&isHalf(peek(d),n))?0.5:1})});
    const weeks=mons.map(m=>{let t=0;for(let i=0;i<7;i++){const x=hrs(n,add(m,i));t+=x.nor+x.o15+x.o2}return t});
    return {n,nor,o15,o2,wk,ab,weeks}});
  const tot=k=>rows.reduce((a,r)=>a+r[k],0);
  const over=rows.filter(r=>r.weeks.some(t=>t>52)).length;
  $('#rp-attSub').textContent=` · ${md(days[0])}~${md(days[days.length-1])} · 잔업 1.5배 ${fmtH(tot('o15'))}h · 2배 ${fmtH(tot('o2'))}h${over?` · 주52h 초과 ${over}명`:''}`;
  $('#rp-attTab').innerHTML=`<thead><tr><th style="text-align:left">이름</th><th>출근일</th><th>정상(h)</th><th>잔업 1.5배(h)</th><th>잔업 2배(h)</th><th>합계(h)</th><th>휴가</th><th>병가</th><th>기타</th>${mons.map(m=>`<th>주 ${md(m)}~</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td class="nm">${esc(r.n)}</td><td class="dt">${r.wk}</td><td class="dt">${fmtH(r.nor)}</td><td class="dt">${r.o15?fmtH(r.o15):''}</td><td class="dt">${r.o2?fmtH(r.o2):''}</td><td class="dt"><b>${fmtH(r.nor+r.o15+r.o2)}</b></td><td class="dt">${r.ab['휴가']||''}</td><td class="dt">${r.ab['병가']||''}</td><td class="dt">${r.ab['기타']||''}</td>${r.weeks.map(t=>`<td class="dt ${t>52?'bad':''}">${t>52?'<b>':''}${fmtH(t)}${t>52?' ⚠</b>':''}</td>`).join('')}</tr>`).join('')}
  <tr class="tot"><td class="nm">합계</td><td class="dt">${tot('wk')}</td><td class="dt">${fmtH(tot('nor'))}</td><td class="dt">${fmtH(tot('o15'))}</td><td class="dt">${fmtH(tot('o2'))}</td><td class="dt"><b>${fmtH(tot('nor')+tot('o15')+tot('o2'))}</b></td><td colspan="${3+mons.length}" class="dt" style="text-align:left">정상 8h(반차 4h, 특근일은 0 — 특근 시간은 OT/휴가에서 입력) · 주별 칸 = 그 주 월~일 합계 (52h 초과 시 빨간색)</td></tr></tbody>`;
}

  const b=$('#rp-cfgBody');
  b.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const c=st.cfg[el.dataset.sh][+el.dataset.i];const f=el.dataset.f;if(f==='k'){const nk=el.value.trim()||c.k;if(nk!==c.k){for(const n in st.skill){const m=st.skill[n];if(c.k in m){m[nk]=m[c.k];delete m[c.k]}}
    for(const d in st.roster){const r=st.roster[d][el.dataset.sh];if(r&&r[c.k]){r[nk]=r[c.k];delete r[c.k]}}c.k=nk}}
  else c[f]=f==='lead'?el.checked:f==='sk'?el.value:+el.value;save();render()});

/* ---------- OT/휴가 ---------- */
let view='roster',otFocus=null;
const VTYPES=['연차','오전반차','오후반차','병가','무급','대체','경조','기타'];
function vacOf(d,n){const r=peek(d);if(!r)return '';const c=r.st?.[n];if(c===2)return '오전반차';if(c===3)return '오후반차';
  if((r.abs?.['병가']||[]).some(a=>a.n===n))return '병가';
  const h=(r.abs?.['휴가']||[]).find(a=>a.n===n);if(h)return VTYPES.includes(h.r)?h.r:'연차';
  if((r.abs?.['기타']||[]).some(a=>a.n===n))return '기타';return ''}
function setVac(d,n,v){const r=day(d);
  for(const k of ABK)r.abs[k]=r.abs[k].filter(a=>a.n!==n);delete r.st[n];
  if(!v)return;
  if(v==='오전반차'||v==='오후반차'){r.st[n]=v==='오전반차'?2:3;r.abs['휴가'].push({n,r:v,auto:1});return}
  removeName(r,n);
  if(v==='병가')r.abs['병가'].push({n,r:''});else if(v==='기타')r.abs['기타'].push({n,r:''});else r.abs['휴가'].push({n,r:v});
}
function otWarn(d){const out=[];const o=st.otx[d]||{};const r=peek(d);
  for(const n in o){if(!(o[n].h>0))continue;
    if(!active(n,d)){out.push(`${n} 재직기간 밖인데 잔업`);continue}
    const v=vacOf(d,n);const c=r?.st?.[n]||0;
    if(c===1)out.push(`${n} (잔업불가)인데 잔업 ${fmtH(o[n].h)}h`);
    else if(v&&v!=='오전반차')out.push(`${n} ${v}인데 잔업 ${fmtH(o[n].h)}h`);}
  return out}
function placeLabel(d,n,seq){const P=placements(d)[n]||[];const w=P.find(x=>x.t==='s');
  if(w)return {t:(w.sh==='야간'?'야간':'주간 '+w.k)+(w.i==='L'?' 조장':''),o:seq.has(n)?seq.get(n):9999,sh:w.sh};
  const a=P.find(x=>x.t==='a');if(a)return {t:a.ab,o:seq.has(n)?seq.get(n):9999,sh:null};
  const e=E[n];return {t:isWork(d)?'미배치':'휴무',o:100000+(e?Date.parse(e.j)/864e5:99999),sh:null}}
function rosterSeq(d){const r=peek(d);const m=new Map();let i=0;if(!r)return m;
  for(const sh of SH)for(const c of st.cfg[sh]){const v=r[sh]?.[c.k];if(!v)continue;if(v.L&&!m.has(v.L))m.set(v.L,i++);(v.M||[]).forEach(n=>{if(n&&!m.has(n))m.set(n,i++)})}
  for(const k of ABK)(r.abs?.[k]||[]).forEach(a=>{if(a.n&&!m.has(a.n))m.set(a.n,i++)});return m}
function renderOT(){
  const d=cur;$('#rp-otDay').textContent=`${md(d)} (${WD[wd(d)]})${HOL[d]?' '+HOL[d]:''} · ${dtype(d)}`;$('#rp-otPick').value=d;
  const o=st.otx[d]||{};
  const names=activeList(d).concat(Object.keys(o).filter(n=>!active(n,d)));
  const seq=rosterSeq(d);const rows=names.map(n=>({n,pl:placeLabel(d,n,seq)})).sort((a,b)=>a.pl.o-b.pl.o);
  let c15=0,h15=0,c2=0,h2=0;for(const n in o)if(o[n].h>0){if(o[n].k===2){c2++;h2+=o[n].h}else{c15++;h15+=o[n].h}}
  $('#rp-otSum').innerHTML=`<span>재직 <b class="num">${activeList(d).length}</b>명</span><span>잔업 1.5배 <b class="num">${c15}</b>명 · <b class="num">${fmtH(h15)}</b>h</span><span>2배 <b class="num">${c2}</b>명 · <b class="num">${fmtH(h2)}</b>h</span>`;
  const warn=new Map(otWarn(d).map(w=>[w.split(' ')[0],w]));
  $('#rp-otTab').innerHTML=`<thead><tr><th>#</th><th style="text-align:left">이름</th><th style="text-align:left">근무인원편성</th><th>주야</th><th>잔업 구분</th><th>시간 입력</th><th>잔업 시간(h)</th><th>휴가</th><th></th><th style="text-align:left">확인</th><th style="text-align:left">비고</th></tr></thead><tbody>${rows.map((x,i)=>{const n=x.n;const e=o[n]||{};const v=vacOf(d,n);const rr=peek(d);const c1=(rr?.st?.[n]||0)===1;const half=v==='오전반차'||v==='오후반차';const blk=otBlock(d,n);const dis=blk?'disabled':'';
    return `<tr data-n="${esc(n)}" class="${v&&!half?'vac':''}${e.h>0?' has':''}${blk?' blk':''}"><td class="dt">${i+1}</td><td class="nm">${esc(n)}${isLead(n)?' <span class="help">조장</span>':''}</td><td class="pl"><b>${esc(x.pl.t)}</b></td>
     <td>${SH.map(sh=>{const cs=e.sh||x.pl.sh;return `<button class="tb${cs===sh?(sh==='야간'?' onN':' on'):''}" data-sh="${sh}" title="${e.sh?'직접 지정':(x.pl.sh?'근무인원편성 기준':'')}">${sh}</button>`}).join('')}</td>

  // OT/휴가
  const OV=L.otVacationData||{};const mine=new Set(emps.map(e=>e.n));
  for(const d in OV){const m=OV[d]||{};for(const n in m){if(!mine.has(n))continue;const x=m[n]||{};
      const r=base.roster[d]||(base.roster[d]={주간:{},야간:{},abs:{휴가:[],병가:[],기타:[]},st:{}});

      const h15=+x.ot15||+x.ot||0,h2=+x.ot20||0;const o={};

async function __gzipToB64(obj) {
  const json = JSON.stringify(obj);
  const cs = new CompressionStream('gzip');
  const stream = new Blob([new TextEncoder().encode(json)]).stream().pipeThrough(cs);
  const buf = await new Response(stream).arrayBuffer();
  const bytes = new Uint8Array(buf);
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}
async function __normalizeBackup(data) {
  if (data == null) return null;
  if (typeof data !== 'string') return data;
  try {
    const bin = atob(data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  } catch (e) {
    console.warn('압축 해제 실패:', e);
    return null;
  }
}

async function __pruneOldBackups(gasUrl, prefix, keep) {
  try {
    const res = await fetch(gasUrl + '?action=list&prefix=' + encodeURIComponent(prefix) + '&_=' + Date.now());   // V078: 해당 종류만 조회
    const j = await res.json();
    if (!j || !j.ok || !Array.isArray(j.files)) return;
    const mine = j.files
      .filter(f => f && f.name && f.name.indexOf(prefix) === 0)
      .sort((a, b) => (b.modified || '').localeCompare(a.modified || ''));
    const toDelete = mine.slice(keep);
    // 과도한 삭제 방지: 한 번에 최대 50개만 (여러 번 저장하며 점진 정리)
    for (const f of toDelete.slice(0, 50)) {
      try { await fetch(gasUrl + '?action=delete&id=' + encodeURIComponent(f.id)); } catch {}
    }
    if (toDelete.length) console.log(`오래된 백업 정리: ${Math.min(toDelete.length,50)}개 삭제 (${prefix})`);
  } catch (e) { /* 정리 실패는 무시 */ }
}

    if (!newBomName || newBomName.trim() === '') return;
    const trimmedNew = newBomName.trim();
    setSettings(prev => ({
      ...prev,
      [section]: {
        ...prev[section],
        items: prev[section].items.map(item => {
          if (item.item === itemName) {
            return {
              ...item,
              partNos: item.partNos.map(pn => {
                if (pn.partNo === partNo) {
                  return {
                    ...pn,
                    bom: pn.bom.map(b => b.name === oldBomName ? {
                      ...b,
                      name: trimmedNew,
                      productName: newProductName !== undefined ? newProductName : b.productName,
                      quantity: newQuantity !== undefined ? newQuantity : b.quantity
                    } : b)
                  };
                }
                return pn;
              })
            };
          }
          return item;
        })
      }
    }));
    setLotData(prev => {
      const newLotData = {};
      Object.entries(prev).forEach(([key, lot]) => {
        if (lot.section === section && lot.item === itemName && lot.partNo === partNo) {
          newLotData[key] = {
            ...lot,
            bomLots: (lot.bomLots || []).map(bl => bl.bomName === oldBomName ? {
              ...bl,
              bomName: trimmedNew
            } : bl)
          };
        } else {
          newLotData[key] = lot;
        }

      return newLotData;
    });
    setFormError(`✅ BOM "${oldBomName}" → "${trimmedNew}" 변경 완료`);
  };
  const addPartNoToItem = () => {
    if (selectedItemIndex === null) {

    setSettings(prev => {

      newItems[selectedItemIndex] = {
        ...newItems[selectedItemIndex],

        }]

        ...prev,

          ...prev[settingSection],

        }

  const removePartNoFromItem = partNoIndex => {

  const addBomItem = () => {

    setSettings(prev => {

  const removeBomItem = bomIndex => {

    const targetPartNo = settings[settingSection].items[selectedItemIndex].partNos[selectedPartNoIndex].partNo;
    const bomToRemove = settings[settingSection].items[selectedItemIndex].partNos[selectedPartNoIndex].bom[bomIndex];
    setSettings(prev => {

              } : p)
            };
          }

      });
      return {
        ...prev,
        [settingSection]: {
          ...prev[settingSection],
          items: newItems
        }
      };

  };
  const getPartNosForSelectedItem = () => {
    if (!formData.item) return [];
    const selectedItem = (settings[activeSection]?.items || []).find(i => i.item === formData.item);
    return selectedItem ? selectedItem.partNos : [];
  };
  const categoryLabels = {
    lines: '라인명/Station',
    items: '아이템/Part No/BOM',
    ct: 'CT (Cycle Time)',
    downtimeTypes: '비가동 유형',
    defectTypes: '불량 종류',
    defectCodes: '불량 코드'
  };
  const handleInputChange = e => {
    const {
      name,
      value
    } = e.target;
    setFormData(prev => ({
      ...prev,
      [name]: value,
      ...(name === 'workers' && {
        selectedWorkers: []
      })
    }));
  };
  const isTimeOverlap = (start1, end1, start2, end2) => {
    const toMinutes = t => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    };
    const s1 = toMinutes(start1);
    const e1 = toMinutes(end1);
    const s2 = toMinutes(start2);
    const e2 = toMinutes(end2);
    const adjustEnd = (s, e) => e < s ? e + 24 * 60 : e;
    const ae1 = adjustEnd(s1, e1);
    const ae2 = adjustEnd(s2, e2);
    return s1 < ae2 && s2 < ae1;
  };
  const findDuplicateWorkers = newLog => {
    const selectedWorkerIds = (newLog.selectedWorkers || []).map(w => typeof w === 'object' ? w.id : w);
    if (selectedWorkerIds.length === 0) return [];
    const duplicates = [];
    productionLogs.forEach(log => {
      if (log.section !== newLog.section) return;
      if (log.productionDate !== newLog.productionDate) return;
      if (log.shift !== newLog.shift) return;
      if (log.lineName === newLog.lineName) return;
      if (!isTimeOverlap(newLog.startTime, newLog.endTime, log.startTime, log.endTime)) return;
      const logWorkerIds = (log.selectedWorkers || []).map(w => typeof w === 'object' ? w.id : w);
      selectedWorkerIds.forEach(workerId => {
        if (logWorkerIds.includes(workerId)) {
          const emp = employees.find(e => e.id === workerId);
          duplicates.push({
            name: emp ? emp.name : workerId,
            lineName: log.lineName,

            endTime: log.endTime
          });

  };
  const [pendingLog, setPendingLog] = useState(null);
  const [showDuplicateWarning, setShowDuplicateWarning] = useState(false);
  const [showDowntimeConfirm, setShowDowntimeConfirm] = useState(false);
  const [pendingDowntime, setPendingDowntime] = useState(null);
  const [downtimeConfirmList, setDowntimeConfirmList] = useState([]);
  const [duplicateWorkers, setDuplicateWorkers] = useState([]);
  // ===== 생산계획 불러오기 (드라이브의 FE 계획 엑셀에서 그날 계획을 읽어 입력 초안 생성) =====
  const [planPickDate, setPlanPickDate] = useState(new Date().toISOString().split('T')[0]);
  const [planDraft, setPlanDraft] = useState(null);      // 불러온 초안 행 배열
  const [planLoading, setPlanLoading] = useState(false);
  const [planWorkerModal, setPlanWorkerModal] = useState({ show: false, key: null, workers: 0, selected: [], line: '', shift: '', date: '' });
  const [planMsg, setPlanMsg] = useState('');

  const __normPno = s => String(s || '').toUpperCase().replace(/[\s\-_./]/g, '');
  // partNos 항목은 문자열이거나 {partNo, bom} 객체일 수 있다
  const __pnoOf = p => (p && typeof p === 'object') ? String(p.partNo || '') : String(p || '');
  const __pnoList = it => ((it && it.partNos) || []).map(__pnoOf).filter(Boolean);
  const __normLine = s => String(s || '').toUpperCase().replace(/[\s\-_./]/g, '');
  const __serialToDate = v => {
    if (typeof v === 'number' && v > 40000) {
      try {
        const d = XLSX.SSF.parse_date_code(v);
        if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
      } catch (e) {}
    }
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    return null;
  };
  const __cell = (ws, r, c) => {
    const x = ws[XLSX.utils.encode_cell({ r, c })];
    return x ? x.v : undefined;
  };

  // TCP 월 시트(예: 26_08월) → [{date, shift, line, part, qty}]
  const __parsePlanRows = wb => {
    const GUB = { '1pcs P/Plan': ['1PC', '주간'], '2pcs P/Plan': ['2PC', '주간'],
                  '1pcs야간 P/Plan': ['1PC', '야간'], '2pcs야간 P/Plan': ['2PC', '야간'] };
    const out = [];
    (wb.SheetNames || []).forEach(sn => {
      if (!/^\d{2}_\d{2}월$/.test(sn)) return;
      const ws = wb.Sheets[sn];
      if (!ws || !ws['!ref']) return;
      const rg = XLSX.utils.decode_range(ws['!ref']);
      const dateCols = {};
      for (let c = 8; c <= rg.e.c; c++) {
        const ds = __serialToDate(__cell(ws, 2, c));
        if (ds) dateCols[c] = ds;
      }
      for (let r = 3; r <= rg.e.r; r++) {
        const part = String(__cell(ws, r, 4) || '').trim();
        const gb = String(__cell(ws, r, 6) || '').trim();
        if (!part || part === '주간' || part === '야간' || !GUB[gb]) continue;
        Object.keys(dateCols).forEach(c => {
          const q = __cell(ws, r, parseInt(c));
          if (typeof q === 'number' && q > 0) {
            out.push({ date: dateCols[c], line: GUB[gb][0], shift: GUB[gb][1], part, pno: part, pname: part, qty: Math.round(q) });
          }
        });
      }
    });
    return out;
  };

  // Lot체계 시트 → { 품명: {code, lc} }
  const __extractLotMaps = wb => {
    const lotMap = {};
    try {
      const ws = wb.Sheets['Lot체계'];
      if (ws && ws['!ref']) {
        const rg = XLSX.utils.decode_range(ws['!ref']);
        for (let r = 1; r <= rg.e.r; r++) {
          const nm = String(__cell(ws, r, 3) || '').trim();
          const code = String(__cell(ws, r, 4) || '').trim();
          const lc = String(__cell(ws, r, 6) || '').trim();
          if (nm && code && lc) lotMap[__normPno(nm)] = { code: code, lc: lc };
        }
      }
    } catch (e) {}
    return { lotMap: lotMap };
  };

  // TCP LOT = 품명코드 + 라인코드 + YYMMDD + (주간 A / 야간 B)
  const __calcLot = (allRows, maps, t) => {
    const lm = maps.lotMap || {};
    // «(A)» 표기는 Lot체계의 «(AM)» 과 같은 항목이므로 보정해서 찾는다
    let m = lm[__normPno(t.part)] || lm[__normPno(String(t.part).replace(/\(A\)\s*$/i, '(AM)'))];
    if (!m) return '';
    const ymd = String(t.date).slice(2, 10).replace(/-/g, '');
    return m.code + m.lc + ymd + (t.shift === '야간' ? 'B' : 'A');
  };

  const loadPlanForDate = async () => {
    if (!planPickDate) { setPlanMsg('날짜를 선택하세요.'); return; }
    if (typeof XLSX === 'undefined') { setPlanMsg('엑셀 모듈 로딩 중입니다. 잠시 후 다시 시도하세요.'); return; }
    setPlanLoading(true);
    setPlanMsg('생산계획을 불러오는 중...');
    setPlanDraft(null);
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxLFrxbAaBt1bBa3SUdDY9wY48tvt85mEDaj3tiKhyw_R7oJCC9GbOWLfWbdSohnQtB/exec';
    try {
      setPlanMsg('[1/3] 공유저장소 파일 목록 확인 중...');
      const listRes = await fetch(GAS_URL + '?action=list&prefix=plan-xlsx-01.TCP&_=' + Date.now());
      if (!listRes.ok) throw new Error('목록 조회 실패 (HTTP ' + listRes.status + ')');
      const list = await listRes.json();
      const files = (list.files || [])
        .filter(f => (f.name || '').indexOf('plan-xlsx-01.TCP') === 0)
        .sort((a, b) => (b.name || '').localeCompare(a.name || ''));
      if (!files.length) { setPlanMsg('공유저장소에 TCP 생산계획 파일이 없습니다.'); setPlanLoading(false); return; }

      // 월별 파일이 나뉘어 있으므로 최근 2개를 확인해 해당 날짜가 들어있는 파일을 사용
      let rows = [], maps = { lotMap: {} }, found = false;
      for (const target of files.slice(0, 1)) {
        setPlanMsg('[2/3] 계획 파일 읽는 중... ' + (target.name || '').slice(-22));
        const res = await fetch(GAS_URL + '?action=load&id=' + encodeURIComponent(target.id) + '&_=' + Date.now());
        if (!res.ok) { continue; }
        const j = await res.json();
        const d = j.data || {};
        const b64 = d.xlsxB64 || (d.data && d.data.xlsxB64);
        if (!b64) continue;
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const wb = XLSX.read(bytes, { cellDates: false, cellFormula: false, sheets: undefined });
        const rs = __parsePlanRows(wb);
        if (rs.some(r => r.date === planPickDate)) {
          rows = rs; maps = __extractLotMaps(wb); found = true; break;
        }
        if (!rows.length) { rows = rs; maps = __extractLotMaps(wb); }
      }

      const dayRows = rows.filter(r => r.date === planPickDate);
      if (!dayRows.length) {
        const avail = [...new Set(rows.map(r => r.date))].sort();
        setPlanMsg(planPickDate + ' 에 해당하는 생산계획이 없습니다.'
          + (avail.length ? ' 파일에 있는 기간: ' + avail[0] + ' ~ ' + avail[avail.length - 1] : ' (계획 데이터를 읽지 못했습니다)'));
        setPlanLoading(false);
        return;
      }

      // 등록된 아이템과 매칭 (품번 → 라인/아이템)
      const secItems = (settings[activeSection] && settings[activeSection].items) || [];
      const draft = dayRows.map((r, idx) => {
        // TCP 계획은 품명(예: HRPE)이므로 등록 아이템명 + 라인으로 매칭
        let cands = secItems.filter(it => __normPno(it.item) === __normPno(r.part) && it.lineName === r.line);
        if (!cands.length) cands = secItems.filter(it => __normPno(it.item) === __normPno(r.part));
        let lineName = '', item = '', partNo = '', partOptions = [];
        if (cands.length === 1) {
          lineName = cands[0].lineName || '';
          item = cands[0].item || '';
          partOptions = __pnoList(cands[0]);
          if (partOptions.length === 1) partNo = partOptions[0];
        }
        // 이미 입력된 생산일지와 겹치면 기본 해제 (같은 날짜·주야·라인·품번)
        const already = productionLogs.some(l =>
          l.section === activeSection &&
          l.productionDate === planPickDate &&
          l.shift === r.shift &&
          (lineName ? l.lineName === lineName : true) &&
          __normPno(l.item) === __normPno(r.part));
        return {
          key: 'p' + idx,
          already: already,
          use: cands.length === 1 && !already,
          productionDate: planPickDate,
          lineName, item, partNo, partOptions,
          planLine: r.line, planName: r.part,
          lotNo: __calcLot(rows, maps, { date: r.date, shift: r.shift, line: r.line, part: r.part }),
          shift: r.shift,
          workers: '',
          selectedWorkers: [],
          goodQuantity: String(r.qty),
          matched: cands.length === 1,
          ambiguous: cands.length > 1
        };
      });
      setPlanDraft(draft);
      const okN = draft.filter(d => d.matched).length;
      const dupN = draft.filter(d => d.already).length;
      setPlanMsg(`계획 ${draft.length}건 · 자동 매칭 ${okN}건`
        + (draft.length - okN ? ` · 확인 필요 ${draft.length - okN}건` : '')
        + (dupN ? ` · 이미 입력됨 ${dupN}건(자동 제외)` : ''));
    } catch (e) {
      const detail = (e && e.stack ? String(e.stack).split('\n')[1] || '' : '').trim();
      setPlanMsg('불러오기 실패: ' + (e.message || e) + (detail ? ' | ' + detail.slice(0, 60) : ''));
      try { console.error('[생산계획 불러오기]', e); } catch (x) {}
    }
    setPlanLoading(false);
  };

  const updateDraft = (key, field, value) => {
    setPlanDraft(prev => prev.map(d => {
      if (d.key !== key) return d;
      const next = { ...d, [field]: value };
      if (field === 'workers') next.selectedWorkers = [];
      if (field === 'lineName') {
        next.item = '';
        next.partNo = '';
        next.partOptions = [];
      }
      if (field === 'item') {
        const secItems = (settings[activeSection] && settings[activeSection].items) || [];
        const found = secItems.find(it => it.lineName === next.lineName && it.item === value);
        next.partOptions = found ? __pnoList(found) : [];
        next.partNo = next.partOptions.length === 1 ? next.partOptions[0] : '';
      }
      return next;
    }));
  };

  const saveDraftLogs = () => {
    const rows = (planDraft || []).filter(d => d.use);
    if (!rows.length) { setPlanMsg('선택된 행이 없습니다.'); return; }
    const bad = rows.filter(d => !d.lineName || !d.item || !d.partNo || !d.workers || !d.goodQuantity);
    if (bad.length) { setPlanMsg(`입력이 비어 있는 행이 ${bad.length}건 있습니다. (라인·아이템·품번·인원·수량 확인)`); return; }
    const noWk = rows.filter(d => !(d.selectedWorkers || []).length).length;
    if (noWk && !window.confirm(`인원 명단이 지정되지 않은 행이 ${noWk}건 있습니다.\n명단 없이 저장할까요? (나중에 목록에서 수정 가능)`)) return;
    const now = Date.now();
    const logs = rows.map((d, i) => ({
      productionDate: d.productionDate,
      lineName: d.lineName,
      item: d.item,
      partNo: d.partNo,
      lotNo: d.lotNo || '',
      shift: d.shift,
      workers: d.workers,
      selectedWorkers: d.selectedWorkers || [],
      goodQuantity: d.goodQuantity,
      time: '1',
      startTime: d.shift === '야간' ? '20:30' : '08:30',
      endTime: d.shift === '야간' ? '05:30' : '17:30',
      section: activeSection,
      id: now + i,
      createdAt: new Date().toLocaleString('ko-KR')
    }));
    setProductionLogs(prev => [...logs.slice().reverse(), ...prev]);
    setPlanDraft(null);
    setPlanMsg(`${logs.length}건이 생산일지에 추가되었습니다. 시간·인원은 목록에서 수정하세요.`);
  };

  const handleSubmit = () => {
    if (!formData.lineName || !formData.item || !formData.partNo || !formData.lotNo || !formData.workers || !formData.goodQuantity || !formData.startTime || !formData.endTime) {
      setFormError('모든 필드를 입력해주세요.');
      return;
    }
    const timePattern = /^([01]?[0-9]|2[0-3]):([0-5][0-9])$/;
    if (!timePattern.test(formData.startTime)) {
      setFormError('시작시간 형식이 올바르지 않습니다.\n올바른 형식: HH:MM (예: 08:30, 20:30)');
      return;
    }
    if (!timePattern.test(formData.endTime)) {
      setFormError('종료시간 형식이 올바르지 않습니다.\n올바른 형식: HH:MM (예: 17:30, 05:30)');
      return;
    }
    const __toMin = t => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    };
    const __sMin = __toMin(formData.startTime),
      __eMin = __toMin(formData.endTime);
    if (__sMin === __eMin) {
      setFormError('시작시간과 종료시간이 같습니다. 다시 확인해주세요.');
      return;
    }
    if (formData.shift === '주간' && __eMin < __sMin) {
      setFormError('주간 근무는 종료시간이 시작시간보다 늦어야 합니다.\n(야간 근무라면 주야 구분을 확인하세요)');
